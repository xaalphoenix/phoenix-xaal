name: Windows build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Core and engine tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_core.py tests/test_engine.py -q

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm packaging/phoenix_stl.spec

      - name: Self-test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/PhoenixSTLStudio/PhoenixSTLStudio.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen selftest failed with exit code $($p.ExitCode)" }

      - name: Zip
        shell: pwsh
        run: 7z a -tzip -mx=5 PhoenixSTLStudio-win64.zip ./dist/PhoenixSTLStudio

      - uses: actions/upload-artifact@v4
        with:
          name: PhoenixSTLStudio-win64
          path: PhoenixSTLStudio-win64.zip
          retention-days: 30
