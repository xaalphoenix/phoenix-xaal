[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-stl-studio"
version = "0.1.0"
description = "Prepare STL files for 3D printing: cut, connect and repair, even very heavy models."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "mapbox-earcut>=1.0",
    "manifold3d>=3.0",
    "psutil>=5.9",
    "PySide6>=6.6",
    "vtk>=9.3",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller>=6.5"]

[project.gui-scripts]
phoenix-stl = "phoenix_stl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phoenix_stl = ["i18n/*.json", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
